<header class="masthead">
  <div class="wrap masthead__inner">
    <a class="site-title" href="{{ '/' | relative_url }}" aria-label="Time Series Connect home">
      <img class="site-logo" src="{{ '/assets/images/727e887e96b1941f1dfcb75f3594c94d.jpg' | relative_url }}" alt="Time Series Connect logo">
      <span class="site-title__name">{{ site.title }}</span>
    </a>
    <nav class="site-nav" aria-label="Primary navigation">
      {% for item in site.data.navigation.main %}
        <a href="{{ item.url | relative_url }}" {% if page.url == item.url %}class="active"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>
    <details class="site-menu">
      <summary>
        <span class="site-menu__icon" aria-hidden="true"></span>
        <span>Menu</span>
      </summary>
      <nav class="site-menu__links" aria-label="Mobile navigation">
        {% for item in site.data.navigation.main %}
          <a href="{{ item.url | relative_url }}" {% if page.url == item.url %}class="active"{% endif %}>{{ item.title }}</a>
        {% endfor %}
      </nav>
    </details>
  </div>
</header>
